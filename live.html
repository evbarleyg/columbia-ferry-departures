<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Columbia · live position</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #101316; --panel: rgba(18, 22, 24, 0.94); --text: #f4f0e8;
      --muted: #b8c2bd; --soft: #899792; --line: rgba(255, 255, 255, 0.14);
      --teal: #43d6b6; --amber: #f4bf47; --rose: #ee7b7b; --green: #9bd85c;
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; background: #9fc7cf; }

    .card {
      position: absolute; top: 14px; left: 14px; z-index: 800; width: min(330px, calc(100vw - 28px));
      padding: 15px 16px; border: 1px solid var(--line); border-radius: 14px;
      background: linear-gradient(180deg, rgba(26, 34, 34, 0.97), rgba(13, 15, 17, 0.96)), var(--panel);
      box-shadow: var(--shadow); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .eyebrow { margin: 0 0 6px; color: var(--teal); font-size: 11px; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 20px; line-height: 1.1; }
    .conn { display: inline-flex; align-items: center; gap: 7px; margin-top: 9px;
      font-size: 12px; font-weight: 700; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--soft);
      box-shadow: 0 0 0 0 rgba(67, 214, 182, 0.5); }
    .dot.live { background: var(--teal); animation: pulse 1.8s infinite; }
    .dot.warn { background: var(--amber); }
    .dot.err { background: var(--rose); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(67, 214, 182, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(67, 214, 182, 0); } 100% { box-shadow: 0 0 0 0 rgba(67, 214, 182, 0); } }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 13px; }
    .cell { padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, 0.05); }
    .cell.wide { grid-column: 1 / -1; }
    .cell .k { display: block; color: var(--soft); font-size: 10px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase; }
    .cell .v { display: block; margin-top: 4px; font-size: 16px; font-weight: 800;
      font-variant-numeric: tabular-nums; }
    .cell .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; }
    .age { margin-top: 11px; color: var(--soft); font-size: 11.5px; }

    .ctl { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; appearance: none; border: 1px solid var(--line); border-radius: 9px;
      background: rgba(255, 255, 255, 0.07); color: var(--text); min-height: 38px; padding: 8px 10px;
      cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; }
    button.on { border-color: rgba(67, 214, 182, 0.5); background: rgba(67, 214, 182, 0.16); color: #eafff8; }
    button:hover { background: rgba(255, 255, 255, 0.11); }

    .note { margin-top: 12px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px;
      color: var(--muted); font-size: 12px; line-height: 1.45; display: none; }
    .note.show { display: block; }

    .vessel-marker { display: grid; place-items: center; width: 34px; height: 34px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5)); transition: transform 0.5s ease; }
    .leaflet-control-zoom a { background: rgba(18, 22, 24, 0.94); color: var(--text); border: 1px solid var(--line); }
    .leaflet-control-attribution { background: rgba(17, 21, 22, 0.82) !important; color: var(--soft) !important; }
    .leaflet-control-attribution a { color: var(--muted) !important; }
  </style>
</head>
<body>
  <main id="map"></main>

  <section class="card">
    <p class="eyebrow">Alaska Marine Highway · live AIS</p>
    <h1>MV Columbia</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">Connecting…</span></div>

    <div class="grid" id="readout" hidden>
      <div class="cell wide"><span class="k">Position</span><span class="v mono" id="pos">—</span></div>
      <div class="cell"><span class="k">Speed</span><span class="v" id="sog">—</span></div>
      <div class="cell"><span class="k">Course</span><span class="v" id="cog">—</span></div>
    </div>
    <div class="age" id="age" hidden></div>

    <div class="ctl">
      <button id="followBtn" class="on" type="button">Following</button>
      <button id="trailBtn" class="on" type="button">Trail</button>
    </div>

    <div class="note" id="note"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const WS_URL = "wss://stream.aisstream.io/v0/stream";
    const COLUMBIA_MMSI = "367144000";
    // Wide box (US West Coast + Alaska) so we track it anywhere on the run.
    const BBOX = [[[40.0, -150.0], [62.0, -118.0]]];
    const TRAIL_MAX = 400;

    const ptTime = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Los_Angeles", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    });

    const el = id => document.getElementById(id);
    const dot = el("dot"), connText = el("connText"), readout = el("readout"), note = el("note");
    let follow = true, showTrail = true, lastTs = null, marker = null;
    const trail = [];

    const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([49.0, -123.4], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    const trailLine = L.polyline([], { color: "#43d6b6", weight: 3, opacity: 0.7 }).addTo(map);

    function vesselIcon(course) {
      const rot = Number.isFinite(course) ? course : 0;
      return L.divIcon({
        className: "",
        html: `<div class="vessel-marker" style="transform:rotate(${rot}deg)">
          <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#43d6b6" stroke="#0c0f10" stroke-width="1.4" stroke-linejoin="round"/>
          </svg></div>`,
        iconSize: [34, 34], iconAnchor: [17, 17]
      });
    }

    function setConn(state, text) {
      dot.className = "dot" + (state ? " " + state : "");
      connText.textContent = text;
    }

    function fmtAge(ms) {
      const s = Math.round(ms / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.floor(s / 60);
      return m < 60 ? `${m}m ${s % 60}s ago` : `${Math.floor(m / 60)}h ${m % 60}m ago`;
    }

    function tickAge() {
      if (!lastTs) return;
      const ms = Date.now() - lastTs;
      el("age").hidden = false;
      el("age").textContent = `Updated ${fmtAge(ms)}`;
      // If AIS goes quiet (out of terrestrial range), soften the live indicator.
      if (ms > 180000 && dot.classList.contains("live")) setConn("warn", "Live · awaiting next ping");
    }
    setInterval(tickAge, 1000);

    function onPosition(meta, report) {
      const lat = report.Latitude ?? meta.latitude;
      const lon = report.Longitude ?? meta.longitude;
      if (lat == null || lon == null) return;
      const sog = report.Sog, cog = report.Cog;
      lastTs = Date.now();
      setConn("live", "Live");
      readout.hidden = false;

      el("pos").textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      el("sog").textContent = (sog != null && sog < 102.3) ? `${sog.toFixed(1)} kn` : "—";
      el("cog").textContent = (cog != null && cog < 360) ? `${Math.round(cog)}°` : "—";

      const latlng = [lat, lon];
      if (!marker) marker = L.marker(latlng, { icon: vesselIcon(cog) }).addTo(map);
      else { marker.setLatLng(latlng); marker.setIcon(vesselIcon(cog)); }

      trail.push(latlng);
      if (trail.length > TRAIL_MAX) trail.shift();
      trailLine.setLatLngs(showTrail ? trail : []);

      if (follow) map.panTo(latlng, { animate: true, duration: 0.5 });
    }

    let ws = null, retry = 0;
    function connect(apiKey) {
      setConn("", retry ? "Reconnecting…" : "Connecting…");
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        retry = 0;
        ws.send(JSON.stringify({
          APIKey: apiKey, BoundingBoxes: BBOX,
          FiltersShipMMSI: [COLUMBIA_MMSI], FilterMessageTypes: ["PositionReport"]
        }));
        setConn("warn", "Connected · waiting for a ping");
      };
      ws.onmessage = ev => {
        let d; try { d = JSON.parse(ev.data); } catch { return; }
        if (d.MessageType === "PositionReport") {
          onPosition(d.MetaData || {}, (d.Message && d.Message.PositionReport) || {});
        } else if (d.error) {
          setConn("err", "Stream error: " + d.error);
        }
      };
      ws.onclose = () => {
        setConn("err", "Disconnected · retrying");
        retry++;
        setTimeout(() => connect(apiKey), Math.min(1000 * retry, 15000));
      };
      ws.onerror = () => ws.close();
    }

    el("followBtn").addEventListener("click", () => {
      follow = !follow;
      el("followBtn").classList.toggle("on", follow);
      el("followBtn").textContent = follow ? "Following" : "Follow";
      if (follow && marker) map.panTo(marker.getLatLng());
    });
    el("trailBtn").addEventListener("click", () => {
      showTrail = !showTrail;
      el("trailBtn").classList.toggle("on", showTrail);
      trailLine.setLatLngs(showTrail ? trail : []);
    });

    // Key is read from the gitignored aisstream_key.txt — served only on your local
    // machine. This page is a LOCAL tool; a public live tracker would need a backend
    // relay so the key never reaches the browser.
    fetch("./aisstream_key.txt")
      .then(r => { if (!r.ok) throw new Error("no key"); return r.text(); })
      .then(k => {
        k = k.trim();
        if (!k) throw new Error("empty key");
        connect(k);
      })
      .catch(() => {
        setConn("err", "No API key");
        note.classList.add("show");
        note.innerHTML = "Live tracking needs an aisstream key. Run this page from the local server with <code>aisstream_key.txt</code> present (it isn't published). For an always-on public tracker, a key-hiding relay is required.";
      });
  </script>
</body>
</html>
