name: Capture Columbia Friday sailing

# Mac-independent cloud capture for the going-forward season (Jun 26+). Runs each
# Friday around the departure window, records the Columbia's track via aisstream,
# finalizes it into the season JSON, and commits — so a GitHub Pages site updates
# itself with no machine running at home.
#
# PREREQUISITE: add the repo secret AISSTREAM_API_KEY (Settings -> Secrets and
# variables -> Actions, or:  gh secret set AISSTREAM_API_KEY < aisstream_key.txt).
# Without it the capture step gets no data and the job is a no-op.
#
# WINDOW NOTE: hosted runners cap at 6h and scheduled crons can start ~10-15 min
# late, so this targets the ~4h DEPARTURE window (the tool's key event), not the
# full all-day track a local run gets. Tuned for the 6:00pm PT departures from
# Jun 26 on; the late 9:45pm Jun 19 sailing is captured locally instead.

on:
  schedule:
    - cron: "0 0 * * 6"   # Sat 00:00 UTC == Fri 17:00 PT (PDT) — start ~1h before a 6pm departure
  workflow_dispatch: {}    # allow manual test runs

permissions:
  contents: write

concurrency:
  group: columbia-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Capture the departure window (~4h)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          FRIDAY=$(TZ=America/Los_Angeles date +%F)
          echo "Capturing Columbia for $FRIDAY (PT)"
          timeout 4h python capture_columbia.py --friday "$FRIDAY" || true

      - name: Finalize into the season JSON
        run: |
          FRIDAY=$(TZ=America/Los_Angeles date +%F)
          python finalize_day.py --friday "$FRIDAY" || echo "nothing captured to finalize"

      - name: Commit the captured track
        run: |
          git config user.name "columbia-capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add columbia_tracks_summer_2026.json
          if git diff --cached --quiet; then
            echo "No track change to commit."
          else
            git commit -m "Capture $(TZ=America/Los_Angeles date +%F) Columbia sailing [skip ci]"
            git push
          fi
