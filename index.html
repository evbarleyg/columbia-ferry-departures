<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MV Columbia · Inside Passage departures</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      color-scheme: dark;
      /* Deep-water chart ink */
      --abyss: #07110f;
      --abyss-2: #0a1815;
      --panel: rgba(11, 24, 21, 0.86);
      --panel-solid: #0c1a17;
      --surface: rgba(190, 220, 210, 0.05);
      --surface-2: rgba(190, 220, 210, 0.09);
      /* Chart-paper ink for text */
      --paper: #ece6d6;
      --paper-dim: #aab7af;
      --paper-faint: #6f8279;
      --line: rgba(190, 220, 210, 0.14);
      --line-2: rgba(190, 220, 210, 0.26);
      /* Signal + encoding */
      --teal: #4fd6b8;
      --green: #a6dd5e;
      --amber: #f3b73f;
      --rose: #ee7b6f;
      --running: #ff8a5b;       /* running-light / live accent */
      --depth: rgba(79, 214, 184, 0.5);
      --shadow: 0 -22px 60px rgba(0, 0, 0, 0.55);
      --sheetPeek: 132px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --serif: "Fraunces", Georgia, serif;
      --mono: "Space Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--abyss); color: var(--paper);
      font-family: var(--mono); letter-spacing: 0; overscroll-behavior: none;
      -webkit-font-smoothing: antialiased; }
    body { overflow: hidden; }

    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    ::selection { background: rgba(79, 214, 184, 0.3); color: #fff; }

    /* ---------- MAP: dark hydrographic chart ---------- */
    #map { position: fixed; inset: 0; background: #0a1a20; z-index: 1; }
    .leaflet-tile {
      filter: invert(1) hue-rotate(186deg) brightness(0.9) contrast(0.92) saturate(0.85);
    }
    @media (max-width: 879px) { .leaflet-control-zoom { display: none; } }
    .leaflet-container { background: #08171c; font-family: var(--mono); }
    .leaflet-control-zoom { border: none !important; box-shadow: none !important; margin: 14px !important; }
    .leaflet-control-zoom a {
      width: 38px; height: 38px; line-height: 38px;
      background: var(--panel-solid); color: var(--paper);
      border: 1px solid var(--line) !important; backdrop-filter: blur(8px);
    }
    .leaflet-control-zoom a:first-child { border-radius: 11px 11px 0 0; }
    .leaflet-control-zoom a:last-child { border-radius: 0 0 11px 11px; border-top: none !important; }
    .leaflet-control-zoom a:hover { background: var(--surface-2); color: var(--teal); }
    .leaflet-control-attribution {
      background: rgba(7, 17, 15, 0.78) !important; color: var(--paper-faint) !important;
      font-family: var(--mono); font-size: 9px; backdrop-filter: blur(6px);
    }
    .leaflet-control-attribution a { color: var(--paper-dim) !important; }

    /* compass + framing overlays */
    .map-overlay { position: fixed; z-index: 5; pointer-events: none; }
    .compass { top: 14px; right: 14px; width: 58px; height: 58px; opacity: 0.78;
      animation: fadein 1.2s ease both; }
    .coord-frame { top: 14px; left: 16px; font-family: var(--mono); font-size: 10.5px;
      letter-spacing: 0.04em; color: var(--paper-faint); animation: fadein 1.2s ease 0.1s both; }
    .coord-frame b { color: var(--paper-dim); font-weight: 400; }

    .leaflet-tooltip.chart-tip {
      background: var(--panel-solid); border: 1px solid var(--line-2); color: var(--paper);
      border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-family: var(--mono);
      font-size: 11px; padding: 7px 9px; backdrop-filter: blur(8px);
    }
    .leaflet-tooltip.chart-tip::before { display: none; }
    .tip-t { color: var(--paper); font-weight: 700; }
    .tip-d { color: var(--paper-dim); }

    /* route departure marker — labeled, not a cryptic letter */
    .dep-marker { display: flex; align-items: center; gap: 6px; transform: translate(-9px, -50%);
      white-space: nowrap; pointer-events: none; }
    .dep-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--abyss);
      box-shadow: 0 0 0 2px currentColor, 0 4px 14px rgba(0,0,0,.5); flex: none; }
    .dep-tag { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 3px 7px; border-radius: 6px; color: var(--abyss);
      background: currentColor; }
    .dep-tag span { color: var(--abyss); }
    .end-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-solid);
      border: 1.5px solid var(--paper-dim); }

    /* ---------- BOTTOM-SHEET CONSOLE (mobile-first) ---------- */
    #console {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 600;
      height: 88vh; max-height: 88vh;
      display: flex; flex-direction: column;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(79,214,184,0.08), transparent 60%),
        linear-gradient(180deg, var(--panel), var(--panel-solid) 22%);
      border-top: 1px solid var(--line-2);
      border-radius: 20px 20px 0 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      transform: translateY(calc(88vh - var(--sheetPeek)));
      transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: none;
      padding-bottom: var(--safe-b);
    }
    #console.dragging { transition: none; }

    .grip { flex: none; padding: 9px 0 4px; display: grid; justify-items: center; cursor: grab; }
    .grip:active { cursor: grabbing; }
    .grip-bar { width: 42px; height: 4px; border-radius: 99px; background: var(--line-2); }

    /* peek header — always visible */
    .peek { flex: none; padding: 2px 18px 14px; cursor: pointer; }
    .peek-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .vessel { font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: -0.01em;
      line-height: 1; }
    .vessel small { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; font-weight: 700;
      color: var(--paper-faint); display: block; margin-bottom: 5px; text-transform: uppercase; }
    .livechip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono);
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--paper-dim); white-space: nowrap; }
    .livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--paper-faint); }
    .livedot.on { background: var(--running); box-shadow: 0 0 0 0 rgba(255,138,91,.6);
      animation: pulse 2s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(255,138,91,0); } 100% { box-shadow: 0 0 0 0 rgba(255,138,91,0); } }

    .peek-read { margin-top: 11px; display: grid; grid-template-columns: auto 1fr; gap: 14px;
      align-items: end; }
    .bigtime { font-family: var(--serif); font-size: 40px; line-height: 0.9; font-weight: 500;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .bigtime .ap { font-size: 16px; font-weight: 400; color: var(--paper-dim); margin-left: 2px; }
    .read-meta { font-family: var(--mono); font-size: 11px; color: var(--paper-dim); line-height: 1.5;
      text-align: right; }
    .read-meta b { color: var(--paper); font-weight: 700; }
    .read-coord { color: var(--paper-faint); font-size: 10px; }

    /* scrollable body — revealed when expanded */
    .body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; padding: 4px 16px calc(28px + var(--safe-b)); }
    .body::-webkit-scrollbar { width: 7px; }
    .body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }

    .rule { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent);
      margin: 6px 0 14px; }

    /* season toggle */
    .seasons { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line);
      border-radius: 11px; background: var(--surface); margin-bottom: 4px; }
    .seasons button { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
      padding: 7px 15px; border-radius: 8px; color: var(--paper-faint); min-height: 38px; transition: 160ms; }
    .seasons button.on { background: var(--teal); color: #04130f; }
    .seasons-note { font-family: var(--mono); font-size: 10.5px; color: var(--paper-faint);
      margin: 9px 2px 0; line-height: 1.45; }

    .section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      margin: 22px 2px 12px; }
    .section-h h2 { margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--paper-dim); }
    .section-h .h-aside { font-family: var(--mono); font-size: 10.5px; color: var(--paper-faint); }

    /* spotlight detail */
    .spot { border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, var(--surface), transparent); }
    .spot-head { display: flex; align-items: stretch; }
    .spot-accent { width: 5px; flex: none; }
    .spot-main { flex: 1; padding: 14px 15px; min-width: 0; }
    .spot-date { font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1; }
    .spot-sub { font-family: var(--mono); font-size: 11px; color: var(--paper-dim); margin-top: 6px;
      display: flex; flex-wrap: wrap; gap: 5px 10px; }
    .spot-sub .v { color: var(--teal); }
    .spot-grid { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); }
    .cell { padding: 12px 15px; }
    .cell + .cell { border-left: 1px solid var(--line); }
    .spot-grid > .cell:nth-child(n+3) { border-top: 1px solid var(--line); }
    .cell .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--paper-faint); }
    .cell .val { font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 5px;
      font-variant-numeric: tabular-nums; }
    .marker-key { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 15px; border-top: 1px solid var(--line);
      font-family: var(--mono); font-size: 10.5px; color: var(--paper-dim); }
    .marker-key span { display: inline-flex; align-items: center; gap: 6px; }
    .mk { width: 10px; height: 10px; border-radius: 50%; flex: none; }

    .empty { padding: 18px 16px; border: 1px dashed var(--line-2); border-radius: 14px;
      color: var(--paper-dim); font-family: var(--mono); font-size: 12px; line-height: 1.55;
      background: var(--surface); }
    .empty b { color: var(--paper); }

    /* legend (departure-time scale) */
    .legend { margin-top: 14px; }
    .legend-bar { height: 12px; border-radius: 99px; border: 1px solid var(--line);
      background: linear-gradient(90deg, var(--teal) 0%, var(--green) 25%, var(--amber) 50%,
        var(--rose) 75%, #d24a4a 100%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    .legend-row { display: flex; justify-content: space-between; margin-top: 6px;
      font-family: var(--mono); font-size: 10px; color: var(--paper-faint); }

    /* sailings list */
    .sailings { display: grid; gap: 8px; }
    .sail { display: grid; grid-template-columns: 4px auto 1fr auto; gap: 12px; align-items: center;
      padding: 12px 14px 12px 0; border: 1px solid var(--line); border-radius: 13px;
      background: var(--surface); cursor: pointer; transition: 160ms; overflow: hidden; min-height: 56px; }
    .sail:hover { border-color: var(--line-2); background: var(--surface-2); }
    .sail.on { border-color: rgba(79,214,184,0.55); background: rgba(79,214,184,0.07); }
    .sail .tick { width: 4px; align-self: stretch; }
    .sail .when { font-family: var(--mono); font-size: 13px; font-weight: 700; padding-left: 14px;
      font-variant-numeric: tabular-nums; }
    .sail .when small { display: block; font-size: 9.5px; font-weight: 400; color: var(--paper-faint);
      letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
    .sail .mid { min-width: 0; }
    .sail .dep { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1;
      font-variant-numeric: tabular-nums; }
    .sail .dep small { font-family: var(--mono); font-size: 10px; font-weight: 400; }
    .sail .delta { font-family: var(--mono); font-size: 10.5px; color: var(--paper-dim); margin-top: 4px; }
    .sail .go { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--paper-faint);
      padding-right: 14px; text-transform: uppercase; }
    .sail.is-empty { cursor: default; opacity: 0.72; }
    .sail.is-empty:hover { border-color: var(--line); background: var(--surface); }
    .sail .pend { font-family: var(--mono); font-size: 11px; color: var(--paper-dim); padding-right: 14px;
      text-transform: uppercase; letter-spacing: 0.06em; }
    .chip { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
      padding: 2px 6px; border-radius: 5px; text-transform: uppercase; border: 1px solid var(--line-2);
      color: var(--paper-dim); }
    .chip.relief { color: var(--amber); border-color: rgba(243,183,63,0.4); background: rgba(243,183,63,0.1); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .toolbar button { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; color: var(--paper-dim);
      min-height: 40px; transition: 150ms; }
    .toolbar button:hover:not(:disabled) { border-color: var(--line-2); color: var(--paper); background: var(--surface); }
    .toolbar button:disabled { opacity: 0.32; cursor: not-allowed; }
    .toolbar button.tgl.on { border-color: rgba(79,214,184,0.5); color: var(--teal); background: rgba(79,214,184,0.08); }

    /* staggered load reveal */
    .reveal { animation: rise 700ms cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { from { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }

    /* ---------- DESKTOP: console becomes a side console ---------- */
    @media (min-width: 880px) {
      :root { --sheetPeek: 0px; }
      #console {
        left: 18px; top: 18px; bottom: 18px; right: auto; width: 412px;
        height: auto; max-height: none; transform: none !important;
        border: 1px solid var(--line-2); border-radius: 18px;
      }
      .grip { display: none; }
      .peek { cursor: default; padding-top: 18px; }
      .compass { right: 22px; top: 22px; }
      .coord-frame { left: 446px; }
    }
  </style>
</head>

<body>
  <main id="map" aria-label="Hydrographic chart of MV Columbia ferry tracks. Full data is in the console below."></main>

  <svg class="map-overlay compass" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="none" stroke="var(--line-2)" stroke-width="1"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="var(--line)" stroke-width="0.6"/>
    <g stroke="var(--paper-faint)" stroke-width="0.8">
      <line x1="50" y1="6" x2="50" y2="16"/><line x1="50" y1="84" x2="50" y2="94"/>
      <line x1="6" y1="50" x2="16" y2="50"/><line x1="84" y1="50" x2="94" y2="50"/>
    </g>
    <path d="M50 12 L56 50 L50 44 L44 50 Z" fill="var(--running)"/>
    <path d="M50 88 L44 50 L50 56 L56 50 Z" fill="var(--paper-faint)"/>
    <text x="50" y="26" text-anchor="middle" font-family="Space Mono" font-size="9" fill="var(--paper-dim)">N</text>
  </svg>
  <div class="map-overlay coord-frame" id="coordFrame"><b>48°43′N</b> · <b>122°31′W</b><br>Bellingham · Salish Sea</div>

  <section id="console" aria-label="MV Columbia departures console">
    <div class="grip" id="grip" aria-hidden="true"><div class="grip-bar"></div></div>

    <div class="peek" id="peek">
      <div class="peek-top">
        <div class="vessel"><small>Alaska Marine Highway</small>MV&nbsp;Columbia</div>
        <div class="livechip"><span class="livedot" id="liveDot"></span><span id="liveText">locating…</span></div>
      </div>
      <div class="peek-read">
        <div class="bigtime" id="peekTime">—</div>
        <div class="read-meta" id="peekMeta">
          <div id="peekLabel">Bellingham · Inside Passage</div>
          <div class="read-coord" id="peekCoord">—</div>
        </div>
      </div>
    </div>

    <div class="body" id="body">
      <div class="rule"></div>

      <div class="reveal" style="animation-delay:.04s">
        <div class="seasons" id="seasons" role="tablist" aria-label="Season">
          <button data-year="2026" class="on" role="tab">2026</button>
          <button data-year="2025" role="tab">2025</button>
        </div>
        <div class="seasons-note" id="seasonNote"></div>
      </div>

      <div class="reveal" style="animation-delay:.10s">
        <div class="section-h"><h2>Spotlight</h2><span class="h-aside" id="spotAside">tap a sailing</span></div>
        <div id="spot"></div>
        <div class="legend">
          <div class="legend-bar" role="img" aria-label="Departure-time scale: teal at 4 PM through amber to red at 10 PM."></div>
          <div class="legend-row"><span>4 PM</span><span>departure time</span><span>10 PM</span></div>
        </div>
      </div>

      <div class="reveal" style="animation-delay:.16s">
        <div class="section-h"><h2 id="listTitle">Friday sailings</h2><span class="h-aside" id="listCount">—</span></div>
        <div class="toolbar" id="toolbar">
          <button id="bRecent">Recent</button>
          <button id="bAll">All</button>
          <button id="bNone">Clear</button>
          <button id="bEarliest">Earliest</button>
          <button id="bLatest">Latest</button>
          <button id="bGeo" class="tgl on">Terminal box</button>
        </div>
        <div class="sailings" id="sailings" style="margin-top:14px"></div>
      </div>
    </div>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script>
  (function () {
    "use strict";

    // ---- data sources -------------------------------------------------------
    const SEASONS = {
      2026: { sources: ["/data/columbia.json", "./columbia_tracks_summer_2026.json"], data: null,
              note: "This season, filling in as each Friday sails. Live position tracked above." },
      2025: { sources: ["./columbia_tracks_summer_fridays_2025.json"], data: null,
              note: "Last year — a complete 22-Friday season, full-resolution AIS." }
    };
    const LIVE_SOURCES = ["/data/live_position.json", "./data/live_position.json"];
    const SIX_PM = 18 * 60;
    const TZ = "America/Los_Angeles";
    const ptTime = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const ptDate = new Intl.DateTimeFormat("en-US", { timeZone: TZ, month: "short", day: "numeric" });
    const ptWeek = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" });

    // ---- helpers ------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    function ptParts(d) { const p = {}; for (const x of ptTime.formatToParts(d)) p[x.type] = x.value; return { h: +p.hour % 24, m: +p.minute, s: +p.second }; }
    function parseISO(s) { const d = new Date(s); return isNaN(d) ? null : d; }
    function minutesAfterMidnight(d) { const { h, m, s } = ptParts(d); return h * 60 + m + s / 60; }
    function fmtClock(d) { if (!d) return ["—", ""]; let { h, m } = ptParts(d); const ap = h >= 12 ? "PM" : "AM"; let hh = h % 12; if (hh === 0) hh = 12; return [`${hh}:${String(m).padStart(2, "0")}`, ap]; }
    function fmtDate(key) { const d = parseISO(key.replace(" ", "T")); return d ? ptDate.format(d) : key.slice(0, 10); }
    function fmtWeek(key) { const d = parseISO(key.replace(" ", "T")); return d ? ptWeek.format(d) : ""; }
    function fmtDelta(min) { if (min == null || Number.isNaN(min)) return "no departure"; const d = Math.round(min - SIX_PM); if (Math.abs(d) < 1) return "on 6 PM"; return `${Math.abs(d)} min ${d < 0 ? "early" : "late"}`; }
    function clamp01(x) { return Math.max(0, Math.min(1, x)); }

    function departureColor(min) {
      if (min == null) return "#7c8a84";
      const t = clamp01((min - 16 * 60) / (22 * 60 - 16 * 60));
      const stops = [[0,[79,214,184]],[.25,[166,221,94]],[.5,[243,183,63]],[.75,[238,123,111]],[1,[210,74,74]]];
      let a = stops[0], b = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) if (t >= stops[i][0] && t <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
      const u = (t - a[0]) / (b[0] - a[0] || 1);
      return `rgb(${a[1].map((c, i) => Math.round(c + (b[1][i] - c) * u)).join(",")})`;
    }

    function haversineNm(a, b) { const r = v => v * Math.PI / 180, R = 3440.065; const dLa = r(b.lat - a.lat), dLo = r(b.lon - a.lon); const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); }
    function trackNm(pts) { let t = 0; for (let i = 1; i < pts.length; i++) t += haversineNm(pts[i-1], pts[i]); return t; }
    function filterWindow(pts) { return pts.map(p => ({ ...p, d: parseISO(p.t) })).filter(p => p.d && minutesAfterMidnight(p.d) >= 14 * 60).sort((a, b) => a.d - b.d); }
    function detectDeparture(pts) { const fast = 8, N = 2; let run = 0, dep = null; for (let i = 0; i < pts.length; i++) { if (+pts[i].sog >= fast) { run++; if (run === N) dep = pts[i - (N - 1)]; } else run = 0; } return dep; }

    function normalize(raw, year) {
      const meta = raw.meta || {};
      return {
        year, meta,
        days: (raw.days || []).map((day, index) => {
          const pts = filterWindow(day.points || []);
          const depP = detectDeparture(pts);
          const depMin = depP ? minutesAfterMidnight(depP.d) : null;
          const first = pts[0] || null, last = pts[pts.length - 1] || null;
          const status = day.status || ((day.points && day.points.length >= 2) ? "captured" : "scheduled");
          return {
            index, key: day.friday_pt, vessel: day.vessel || "COLUMBIA", status,
            captured: status === "captured" && pts.length >= 2,
            dateLabel: fmtDate(day.friday_pt), weekLabel: fmtWeek(day.friday_pt),
            points: pts, departurePoint: depP, departureTime: depP ? depP.d : null, departureMinutes: depMin,
            color: departureColor(depMin), first, last,
            distanceNm: pts.length > 1 ? trackNm(pts) : 0,
            maxSog: pts.reduce((mx, p) => Math.max(mx, +p.sog || 0), 0),
            durationMin: first && last ? (last.d - first.d) / 60000 : null
          };
        })
      };
    }

    // ---- map ----------------------------------------------------------------
    const map = L.map("map", { zoomControl: false, preferCanvas: true, attributionControl: true }).setView([48.73, -122.52], 11);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);
    const geoLayer = L.layerGroup().addTo(map);
    const routeLayer = L.layerGroup().addTo(map);
    const markLayer = L.layerGroup().addTo(map);
    let geoRect = null, showGeo = true;

    function reduceMotion() { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    function isMobile() { return window.matchMedia("(max-width: 879px)").matches; }

    // ---- state --------------------------------------------------------------
    let YEAR = 2026, SEASON = null, routes = [], byKey = new Map(), selected = new Set(), activeKey = null;

    function captured() { return routes.filter(r => r.captured); }

    function drawGeofence() {
      geoLayer.clearLayers(); const m = SEASON && SEASON.meta;
      if (!m || m.lat_min == null) { geoRect = null; return; }
      geoRect = L.rectangle([[m.lat_min, m.lon_min], [m.lat_max, m.lon_max]],
        { color: "rgba(79,214,184,0.45)", weight: 1, dashArray: "4 8", fill: false });
      if (showGeo) geoRect.addTo(geoLayer);
    }

    function depMarkerIcon(color, label) {
      return L.divIcon({ className: "", iconSize: [0, 0], html:
        `<div class="dep-marker"><span class="dep-dot" style="background:${color};color:${color}"></span>` +
        `<span class="dep-tag" style="color:${color}"><span>DEPARTURE ${label}</span></span></div>` });
    }
    function endIcon() { return L.divIcon({ className: "", iconSize: [9, 9], iconAnchor: [4, 4], html: `<span class="end-dot"></span>` }); }

    function drawRoute(r) {
      if (r.points.length < 2) return;
      const active = r.key === activeKey;
      const ll = r.points.map(p => [p.lat, p.lon]);
      if (active) L.polyline(ll, { color: "rgba(236,230,214,0.85)", weight: 10, opacity: 0.5, lineCap: "round" }).addTo(routeLayer);
      const line = L.polyline(ll, { color: r.color, weight: active ? 5 : 3, opacity: active ? 1 : 0.55, lineCap: "round", lineJoin: "round" })
        .bindTooltip(`<div class="tip-t">${r.weekLabel} ${r.dateLabel}</div><div class="tip-d">${r.vessel} · ${trk(r)}</div>`, { sticky: true, className: "chart-tip" })
        .addTo(routeLayer);
      line.on("click", () => setActive(r.key, false));
      if (active) {
        if (r.first) L.marker([r.first.lat, r.first.lon], { icon: endIcon(), interactive: false }).addTo(markLayer);
        if (r.last) L.marker([r.last.lat, r.last.lon], { icon: endIcon(), interactive: false }).addTo(markLayer);
        if (r.departurePoint) {
          const [t] = fmtClock(r.departureTime);
          L.marker([r.departurePoint.lat, r.departurePoint.lon], { icon: depMarkerIcon(r.color, t), interactive: false, zIndexOffset: 1000 }).addTo(markLayer);
        }
      }
    }
    function trk(r) { return `${r.distanceNm.toFixed(1)} nm · max ${r.maxSog.toFixed(0)} kn`; }

    function renderMap() {
      routeLayer.clearLayers(); markLayer.clearLayers();
      geoLayer.clearLayers(); if (geoRect && showGeo) geoRect.addTo(geoLayer);
      for (const r of routes) if (selected.has(r.key)) drawRoute(r);
    }

    function fitTo(rs) {
      const b = rs.filter(r => r.points.length).map(r => L.latLngBounds(r.points.map(p => [p.lat, p.lon])));
      if (b.length) { let c = b[0]; for (let i = 1; i < b.length; i++) c = c.extend(b[i]);
        map.fitBounds(c.pad(0.18), padding()); return; }
      const m = SEASON && SEASON.meta;
      if (m && m.lat_min != null) map.fitBounds([[m.lat_min, m.lon_min], [m.lat_max, m.lon_max]], padding());
    }
    function padding() {
      if (!isMobile()) return { paddingTopLeft: [440, 30], paddingBottomRight: [30, 30] };
      const open = SHEET.state !== "peek";
      return { paddingTopLeft: [20, 20], paddingBottomRight: [20, open ? Math.round(window.innerHeight * 0.5) : 150] };
    }

    // ---- console render -----------------------------------------------------
    function setActive(key, fit) {
      const r = byKey.get(key); if (!r || !r.captured) return;
      activeKey = key; selected.add(key);
      renderMap(); renderSpot(); renderList();
      if (fit) fitTo([r]);
      if (isMobile() && SHEET.state === "peek") SHEET.go("half");
    }
    function chooseActive() { if (activeKey && byKey.get(activeKey)?.captured && selected.has(activeKey)) return;
      const sel = captured().filter(r => selected.has(r.key)); activeKey = sel.length ? sel[sel.length - 1].key : null; }
    function selectKeys(keys) { selected = new Set(keys); chooseActive(); renderMap(); renderSpot(); renderList(); fitTo(captured().filter(r => selected.has(r.key))); }

    function renderPeek() {
      const r = activeKey ? byKey.get(activeKey) : null;
      if (r && r.departureTime) {
        const [t, ap] = fmtClock(r.departureTime);
        $("peekTime").innerHTML = `${t}<span class="ap">${ap}</span>`;
        $("peekLabel").innerHTML = `<b>${r.weekLabel} ${r.dateLabel}</b> · ${r.vessel}`;
        $("peekCoord").textContent = `dep ${fmtDelta(r.departureMinutes)} · ${r.distanceNm.toFixed(1)} nm tracked`;
      } else {
        const cap = captured().length, total = routes.length;
        $("peekTime").innerHTML = cap ? `${cap}<span class="ap">/${total}</span>` : `—`;
        $("peekLabel").innerHTML = cap ? `<b>${cap} sailings tracked</b>` : `<b>Season not started</b>`;
        $("peekCoord").textContent = cap ? "tap a sailing to spotlight it" : "first track lands once a Friday sails";
      }
    }

    function renderSpot() {
      renderPeek();
      const r = activeKey ? byKey.get(activeKey) : null;
      const el = $("spot");
      if (!r) {
        const cap = captured().length;
        el.innerHTML = `<div class="empty">${cap ? "Select a sailing to read its <b>detected departure</b>, track length and speed." :
          "No Fridays have sailed yet this season. Cards light up as each one is captured — the next is <b>" + (nextScheduled() || "soon") + "</b>."}</div>`;
        $("spotAside").textContent = cap ? "tap a sailing" : "—";
        return;
      }
      $("spotAside").textContent = `${r.vessel.toLowerCase()}`;
      const [t, ap] = fmtClock(r.departureTime);
      el.innerHTML = `
        <div class="spot"><div class="spot-head">
          <div class="spot-accent" style="background:${r.color}"></div>
          <div class="spot-main">
            <div class="spot-date">${r.weekLabel} ${r.dateLabel}</div>
            <div class="spot-sub"><span>Departure <span class="v">${t} ${ap}</span></span><span>${fmtDelta(r.departureMinutes)}</span></div>
          </div></div>
          <div class="spot-grid">
            <div class="cell"><div class="k">Track in view</div><div class="val">${r.distanceNm.toFixed(1)} <small style="font-size:11px;color:var(--paper-faint)">nm</small></div></div>
            <div class="cell"><div class="k">Top speed</div><div class="val">${r.maxSog.toFixed(1)} <small style="font-size:11px;color:var(--paper-faint)">kn</small></div></div>
            <div class="cell"><div class="k">Time in box</div><div class="val">${r.durationMin ? Math.round(r.durationMin) + " min" : "—"}</div></div>
            <div class="cell"><div class="k">AIS pings</div><div class="val">${r.points.length}</div></div>
          </div>
          <div class="marker-key">
            <span><i class="mk" style="background:${r.color}"></i> Departure</span>
            <span><i class="mk" style="background:var(--panel-solid);border:1.5px solid var(--paper-dim)"></i> First &amp; last ping</span>
          </div>
        </div>`;
    }

    function nextScheduled() { const n = routes.find(r => r.status === "scheduled") || routes.find(r => r.status === "pending"); return n ? n.weekLabel + " " + n.dateLabel : null; }

    function renderList() {
      const wrap = $("sailings"); wrap.innerHTML = "";
      $("listCount").textContent = `${routes.length} Fridays`;
      const noData = captured().length === 0;
      ["bRecent", "bAll", "bEarliest", "bLatest"].forEach(id => $(id).disabled = noData);
      for (const r of routes) {
        const row = document.createElement("div");
        if (r.captured) {
          row.className = "sail" + (activeKey === r.key ? " on" : "");
          const [t, ap] = fmtClock(r.departureTime);
          const relief = r.vessel !== "COLUMBIA";
          row.innerHTML = `
            <span class="tick" style="background:${r.color}"></span>
            <div class="when">${r.dateLabel}<small>${r.weekLabel}</small></div>
            <div class="mid"><div class="dep">${t}<small> ${ap}</small></div><div class="delta">${fmtDelta(r.departureMinutes)} · ${r.distanceNm.toFixed(1)} nm${relief ? ' · <span class="chip relief">'+r.vessel+'</span>' : ''}</div></div>
            <div class="go">view ›</div>`;
          row.addEventListener("click", () => setActive(r.key, true));
        } else {
          const pend = r.status === "pending";
          row.className = "sail is-empty";
          row.innerHTML = `
            <span class="tick" style="background:${pend ? 'rgba(243,183,63,.5)' : 'var(--line-2)'}"></span>
            <div class="when">${r.dateLabel}<small>${r.weekLabel}</small></div>
            <div class="mid"><div class="dep" style="font-size:13px;color:var(--paper-faint)">${r.vessel}${relief2(r)}</div></div>
            <div class="pend">${pend ? "awaiting NOAA" : "upcoming"}</div>`;
        }
        wrap.appendChild(row);
      }
    }
    function relief2(r) { return r.vessel !== "COLUMBIA" ? ' <span class="chip relief">relief</span>' : ''; }

    // ---- season switching ---------------------------------------------------
    async function loadSeason(year) {
      const S = SEASONS[year];
      if (!S.data) { for (const u of S.sources) { try { const r = await fetch(u, { cache: "no-store" }); if (r.ok) { S.data = normalize(await r.json(), year); break; } } catch (e) {} } }
      return S.data;
    }
    async function setSeason(year) {
      YEAR = year;
      [...$("seasons").children].forEach(b => b.classList.toggle("on", +b.dataset.year === year));
      $("seasonNote").textContent = SEASONS[year].note;
      $("listTitle").textContent = `Friday sailings · ${year}`;
      const data = await loadSeason(year);
      if (!data) { $("spot").innerHTML = `<div class="empty">Couldn’t load the ${year} data.</div>`; return; }
      SEASON = data; routes = data.days; byKey = new Map(routes.map(r => [r.key, r]));
      const cap = captured(); const recent = cap.slice(Math.max(0, cap.length - 4));
      selected = new Set(recent.map(r => r.key)); activeKey = recent.length ? recent[recent.length - 1].key : null;
      drawGeofence(); renderMap(); renderSpot(); renderList(); fitTo(cap.filter(r => selected.has(r.key)));
    }

    // ---- draggable bottom sheet ---------------------------------------------
    const SHEET = (function () {
      const el = $("console"); const snaps = { peek: () => window.innerHeight * 0.88 - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sheetPeek")), half: () => window.innerHeight * 0.44, full: () => 0 };
      let state = "peek", dragging = false, startY = 0, startT = 0;
      function ty(state) { return snaps[state](); }
      function set(s) { state = s; SHEET.state = s; if (!isMobile()) return; el.style.transform = `translateY(${ty(s)}px)`; setTimeout(() => map.invalidateSize(), 380); }
      function go(s) { set(s); }
      function onDown(e) { if (!isMobile()) return; dragging = true; el.classList.add("dragging"); startY = (e.touches ? e.touches[0].clientY : e.clientY); startT = ty(state); }
      function onMove(e) { if (!dragging) return; const y = (e.touches ? e.touches[0].clientY : e.clientY); const t = Math.max(0, Math.min(window.innerHeight * 0.88, startT + (y - startY))); el.style.transform = `translateY(${t}px)`; }
      function onUp(e) { if (!dragging) return; dragging = false; el.classList.remove("dragging"); const cur = parseFloat(el.style.transform.replace(/[^0-9.]/g, "")) || 0; const order = ["full", "half", "peek"]; let best = "peek", bd = Infinity; for (const s of order) { const d = Math.abs(cur - ty(s)); if (d < bd) { bd = d; best = s; } } set(best); }
      $("grip").addEventListener("pointerdown", onDown);
      $("peek").addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; onDown(e); });
      window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", onUp);
      $("peek").addEventListener("click", (e) => { if (dragging || e.target.closest("button")) return; if (isMobile()) set(state === "peek" ? "half" : "peek"); });
      window.addEventListener("resize", () => { if (isMobile()) set(state); else el.style.transform = ""; setTimeout(() => map.invalidateSize(), 200); });
      return { go, get state() { return state; }, set state(v) { state = v; } };
    })();

    // ---- live position ------------------------------------------------------
    async function pollLive() {
      for (const u of LIVE_SOURCES) {
        try { const r = await fetch(u + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) continue;
          const d = await r.json(); const p = d.latest; if (!p) break;
          const ageMin = (Date.now() - new Date(p.t).getTime()) / 60000;
          const live = ageMin < 14;
          $("liveDot").className = "livedot" + (live ? " on" : "");
          $("liveText").textContent = d.in_box ? "at Bellingham" : (live ? `under way · ${(+p.sog).toFixed(0)} kn` : "last seen " + Math.round(ageMin) + "m");
          $("coordFrame").innerHTML = `<b>${p.lat.toFixed(4)}°</b> · <b>${p.lon.toFixed(4)}°</b><br>${d.in_box ? "in the terminal box" : "Columbia · live AIS"}`;
          return;
        } catch (e) {}
      }
      $("liveText").textContent = "position offline";
    }

    // ---- wire + boot --------------------------------------------------------
    $("seasons").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setSeason(+b.dataset.year); });
    $("bRecent").addEventListener("click", () => { const c = captured(); selectKeys(c.slice(Math.max(0, c.length - 4)).map(r => r.key)); });
    $("bAll").addEventListener("click", () => selectKeys(captured().map(r => r.key)));
    $("bNone").addEventListener("click", () => selectKeys([]));
    $("bEarliest").addEventListener("click", () => { const r = captured().filter(x => x.departureMinutes != null).sort((a, b) => a.departureMinutes - b.departureMinutes)[0]; if (r) setActive(r.key, true); });
    $("bLatest").addEventListener("click", () => { const r = captured().filter(x => x.departureMinutes != null).sort((a, b) => b.departureMinutes - a.departureMinutes)[0]; if (r) setActive(r.key, true); });
    $("bGeo").addEventListener("click", () => { showGeo = !showGeo; $("bGeo").classList.toggle("on", showGeo); renderMap(); });

    setSeason(2026).then(() => { pollLive(); setInterval(pollLive, 60000); });
  })();
  </script>
</body>
</html>
